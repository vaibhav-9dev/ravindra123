<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAMES</title>

    <style>
        body{
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        *,
        *::before,
        *::after{
            box-sizing: border-box;
        }

        .box{
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: min(400px, 90vw);
            align-items: center;
        }

        .primary, .secondary{
            width: 100%;
            max-width: 400px;
            height: 100px;
            color: aliceblue;
            background-color: rgb(0, 9, 9);
            border: 3px solid white;
            position: relative;
            border-radius: 8px;
        }

        h2{
            position: absolute;
            left: 3%;
            top: 17%;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
        }

        input{
            height: 18.5px;
            position: absolute;
            bottom: 9.5%;
            left: 3%;
            border-radius: 5px;
            font-size: medium;
            max-width: 94%;
        }

        .label{
            position: absolute;
            left: 3%;
            top: -5%;
            font-family: Arial, Helvetica, sans-serif;
        }

        #result {
            position: static;
            color: white;
            margin-top: -20px;
            text-align: center;
            font-size: 24px;
            max-width: 90vw;
            overflow-wrap: break-word;
        }

        .out {
            position: relative;
            width: min(250px, 70vw);
            height: 28px;
            left: auto;
            bottom: auto;
            border: 3px solid white;
            border-radius: 8px;
            color: white;
            background-color: black;
        }

        /* Small mobile screens */
        @media (max-width: 450px){
            .box{
                width: 90vw;
                gap: 40px;
            }

            .primary,
            .secondary{
                width: 100%;
            }

            h2{
                font-size: 1.3em;
            }

            input{
                width: 94%;
            }

            .out{
                width: 70vw;
            }

            #result{
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="primary">
            <h2>Enter your name:</h2>
            
            <input type="text" id="name" style="font-family: Arial, Helvetica, sans-serif;">
        </div>

        <div class="secondary">
            <h2>Enter other name:</h2>
            <input type="text" id="name2" style="font-family: Arial, Helvetica, sans-serif;">
        </div>

        <button class="out" onclick="showResult()">FLAMES</button>

        <h2 class="label" id="result" style="color: rgb(253, 253, 254);"></h2>

    </div>

</body>
